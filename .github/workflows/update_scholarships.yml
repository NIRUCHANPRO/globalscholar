name: 24/7 AI Foreign Scholarship Hunter

on:
  schedule:
    - cron: "0 */12 * * *" # Har 12 ghante mein naye scholarships khojega
  workflow_dispatch:       # Manual 1-click button bhi rahega

permissions:
  contents: write

jobs:
  hunt-scholarships:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Requests
        run: pip install requests

      - name: Run AI Scholarship Hunter Bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scholarship_ai_hunter.py

      - name: Auto-Commit Updated Scholarships JSON
        run: |
          git config user.name "GlobalScholar AI Bot"
          git config user.email "bot@globalscholar.ai"
          git add scholarships.json
          git diff --staged --quiet || git commit -m "🤖 AI Hunter added new verified foreign scholarships"
          git push
